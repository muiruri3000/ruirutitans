name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Django & Python 3.13)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-test-secret-key-for-github-actions-only-12345
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,ruirutitans.com,.ruirutitans.com
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://ruirutitans.com
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,https://ruirutitans.com
      SQLITE_PATH: data/ci_test_db.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Checks
        run: |
          python manage.py check

      - name: Run Django Tests
        run: |
          python manage.py test

  frontend:
    name: Frontend (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm run build
