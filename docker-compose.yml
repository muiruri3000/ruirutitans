version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ruirutitans-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruirutitans}
      MYSQL_USER: ${MYSQL_USER:-titans_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-titans_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "${MYSQL_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ruirutitans-backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-QfuD9xXBeWplit7YdpR3zTogiRNFn0ROgJZh6uql_FspHRdRZotnUXj3CTyOF5XvwA8}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-ruirutitans.com,.ruirutitans.com,localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ruirutitans.com,https://www.ruirutitans.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ruirutitans.com,https://*.ruirutitans.com}
      - USE_MYSQL=True
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ruirutitans}
      - MYSQL_USER=${MYSQL_USER:-titans_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-titans_pass}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    ports:
      - "8000:8000"
    volumes:
      - backups_data:/app/backups
      - media_data:/app/media
      - sqlite_data:/app/data
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ruirutitans-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  backups_data:
  media_data:
  sqlite_data:
