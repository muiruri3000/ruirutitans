apiVersion: v1
kind: ConfigMap
metadata:
  name: ruirutitans-config
  namespace: ruirutitans
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "ruirutitans.com,.ruirutitans.com"
  CORS_ALLOWED_ORIGINS: "https://ruirutitans.com,https://www.ruirutitans.com"
  CSRF_TRUSTED_ORIGINS: "https://ruirutitans.com,https://*.ruirutitans.com"
  DB_ENGINE: "mysql"
  USE_MYSQL: "True"
  MYSQL_HOST: "ruirutitans-mysql-svc"
  MYSQL_PORT: "3306"
  SQLITE_PATH: "/app/data/db.sqlite3"
  SECURE_SSL_REDIRECT: "True"
  SECURE_HSTS_SECONDS: "31536000"
  # Configure TRUSTED_PROXY_CIDRS with the K3s pod/Traefik CIDR (e.g. "10.42.0.0/16")
  # and Cloudflare edge proxy CIDRs so real client IPs in X-Forwarded-For and CF-Connecting-IP are trusted.
  TRUSTED_PROXY_CIDRS: "10.42.0.0/16,127.0.0.1,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

