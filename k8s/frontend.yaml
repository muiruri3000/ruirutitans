apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruirutitans-frontend
  namespace: ruirutitans
  labels:
    app.kubernetes.io/name: ruirutitans-frontend
    app.kubernetes.io/part-of: ruirutitans-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ruirutitans-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ruirutitans-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ruirutitans-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ruirutitans-frontend-svc
  namespace: ruirutitans
  labels:
    app.kubernetes.io/name: ruirutitans-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: ruirutitans-frontend
