apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruirutitans-data-pvc
  namespace: ruirutitans
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruirutitans-media-pvc
  namespace: ruirutitans
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruirutitans-backups-pvc
  namespace: ruirutitans
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
