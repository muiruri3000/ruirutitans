# -----------------------------------------------------------------------------
# WARNING: DO NOT APPLY THIS FILE DIRECTLY TO PRODUCTION!
# DO NOT ADD THIS FILE TO k8s/kustomization.yaml!
#
# Production secrets must be provisioned directly on your K3s cluster.
#
# Recommended creation command:
#   SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
#   kubectl create secret generic ruirutitans-secrets \
#     -n ruirutitans \
#     --from-literal=SECRET_KEY="$SECRET_KEY"
#
# If running with MySQL (DB_ENGINE=mysql):
#   kubectl create secret generic ruirutitans-secrets \
#     -n ruirutitans \
#     --from-literal=SECRET_KEY="$SECRET_KEY" \
#     --from-literal=MYSQL_DATABASE="ruirutitans" \
#     --from-literal=MYSQL_USER="titans_user" \
#     --from-literal=MYSQL_PASSWORD="<STRONG_PASSWORD>" \
#     --from-literal=MYSQL_ROOT_PASSWORD="<STRONG_ROOT_PASSWORD>"
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ruirutitans-secrets
  namespace: ruirutitans
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_TO_A_CRYPTOGRAPHICALLY_SECURE_SECRET_KEY"
  # Optional MySQL credentials:
  MYSQL_DATABASE: "ruirutitans"
  MYSQL_USER: "titans_user"
  MYSQL_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_STRONG_ROOT_PASSWORD"
